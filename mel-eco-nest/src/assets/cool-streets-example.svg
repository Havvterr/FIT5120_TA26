<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f5f5f5"/>
  
  <!-- 天空 -->
  <rect width="800" height="200" fill="#bbdefb"/>
  
  <!-- 街道基础 -->
  <rect x="0" y="200" width="800" height="400" fill="#90a4ae"/>
  
  <!-- 主要道路 -->
  <rect x="100" y="300" width="600" height="150" fill="#78909c"/>
  
  <!-- 透水性路面区域 -->
  <rect x="100" y="300" width="600" height="150" fill="#b0bec5" opacity="0.7"/>
  <pattern id="permeablePaving" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
    <rect width="20" height="20" fill="#b0bec5"/>
    <circle cx="10" cy="10" r="3" fill="#78909c"/>
  </pattern>
  <rect x="100" y="300" width="600" height="150" fill="url(#permeablePaving)" opacity="0.5"/>
  
  <!-- 人行道 -->
  <rect x="100" y="250" width="600" height="50" fill="#cfd8dc"/>
  <rect x="100" y="450" width="600" height="50" fill="#cfd8dc"/>
  
  <!-- 建筑物 -->
  <rect x="100" y="100" width="100" height="150" fill="#455a64"/>
  <rect x="250" y="100" width="100" height="150" fill="#546e7a"/>
  <rect x="400" y="100" width="100" height="150" fill="#455a64"/>
  <rect x="550" y="100" width="100" height="150" fill="#546e7a"/>
  
  <rect x="100" y="500" width="100" height="100" fill="#455a64"/>
  <rect x="250" y="500" width="100" height="100" fill="#546e7a"/>
  <rect x="400" y="500" width="100" height="100" fill="#455a64"/>
  <rect x="550" y="500" width="100" height="100" fill="#546e7a"/>
  
  <!-- 建筑物窗户 -->
  <rect x="120" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="160" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="120" y="170" width="20" height="30" fill="#eceff1"/>
  <rect x="160" y="170" width="20" height="30" fill="#eceff1"/>
  
  <rect x="270" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="310" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="270" y="170" width="20" height="30" fill="#eceff1"/>
  <rect x="310" y="170" width="20" height="30" fill="#eceff1"/>
  
  <rect x="420" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="460" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="420" y="170" width="20" height="30" fill="#eceff1"/>
  <rect x="460" y="170" width="20" height="30" fill="#eceff1"/>
  
  <rect x="570" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="610" y="120" width="20" height="30" fill="#eceff1"/>
  <rect x="570" y="170" width="20" height="30" fill="#eceff1"/>
  <rect x="610" y="170" width="20" height="30" fill="#eceff1"/>
  
  <rect x="120" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="160" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="120" y="570" width="20" height="30" fill="#eceff1"/>
  <rect x="160" y="570" width="20" height="30" fill="#eceff1"/>
  
  <rect x="270" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="310" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="270" y="570" width="20" height="30" fill="#eceff1"/>
  <rect x="310" y="570" width="20" height="30" fill="#eceff1"/>
  
  <rect x="420" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="460" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="420" y="570" width="20" height="30" fill="#eceff1"/>
  <rect x="460" y="570" width="20" height="30" fill="#eceff1"/>
  
  <rect x="570" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="610" y="520" width="20" height="30" fill="#eceff1"/>
  <rect x="570" y="570" width="20" height="30" fill="#eceff1"/>
  <rect x="610" y="570" width="20" height="30" fill="#eceff1"/>
  
  <!-- 街道树木 -->
  <!-- 北侧 -->
  <circle cx="150" cy="275" r="25" fill="#2e7d32"/>
  <circle cx="300" cy="275" r="25" fill="#388e3c"/>
  <circle cx="450" cy="275" r="25" fill="#2e7d32"/>
  <circle cx="600" cy="275" r="25" fill="#388e3c"/>
  
  <!-- 南侧 -->
  <circle cx="150" cy="475" r="25" fill="#388e3c"/>
  <circle cx="300" cy="475" r="25" fill="#2e7d32"/>
  <circle cx="450" cy="475" r="25" fill="#388e3c"/>
  <circle cx="600" cy="475" r="25" fill="#2e7d32"/>
  
  <!-- 树木底座/绿化带 -->
  <rect x="125" y="250" width="50" height="50" rx="5" fill="#81c784"/>
  <rect x="275" y="250" width="50" height="50" rx="5" fill="#81c784"/>
  <rect x="425" y="250" width="50" height="50" rx="5" fill="#81c784"/>
  <rect x="575" y="250" width="50" height="50" rx="5" fill="#81c784"/>
  
  <rect x="125" y="450" width="50" height="50" rx="5" fill="#81c784"/>
  <rect x="275" y="450" width="50" height="50" rx="5" fill="#81c784"/>
  <rect x="425" y="450" width="50" height="50" rx="5" fill="#81c784"/>
  <rect x="575" y="450" width="50" height="50" rx="5" fill="#81c784"/>
  
  <!-- 街道中央绿化带 -->
  <rect x="100" y="350" width="600" height="50" fill="#81c784"/>
  
  <!-- 中央绿化带植物 -->
  <circle cx="150" cy="375" r="15" fill="#2e7d32"/>
  <circle cx="250" cy="375" r="15" fill="#388e3c"/>
  <circle cx="350" cy="375" r="15" fill="#2e7d32"/>
  <circle cx="450" cy="375" r="15" fill="#388e3c"/>
  <circle cx="550" cy="375" r="15" fill="#2e7d32"/>
  <circle cx="650" cy="375" r="15" fill="#388e3c"/>
  
  <!-- 花朵 -->
  <circle cx="200" cy="375" r="5" fill="#f06292"/>
  <circle cx="300" cy="375" r="5" fill="#ba68c8"/>
  <circle cx="400" cy="375" r="5" fill="#ffeb3b"/>
  <circle cx="500" cy="375" r="5" fill="#f06292"/>
  <circle cx="600" cy="375" r="5" fill="#ba68c8"/>
  
  <!-- 太阳 -->
  <circle cx="700" cy="100" r="40" fill="#ffeb3b"/>
  
  <!-- 降温效果指示 -->
  <defs>
    <linearGradient id="coolGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="100" y="200" width="600" height="300" fill="url(#coolGradient)" opacity="0.5"/>
  
  <!-- 行人 -->
  <circle cx="200" cy="480" r="10" fill="#5d4037"/>
  <rect x="195" y="490" width="10" height="20" fill="#5d4037"/>
  <line x1="195" y1="500" x2="185" y2="510" stroke="#5d4037" stroke-width="3"/>
  <line x1="205" y1="500" x2="215" y2="510" stroke="#5d4037" stroke-width="3"/>
  
  <circle cx="500" cy="270" r="10" fill="#5d4037"/>
  <rect x="495" y="280" width="10" height="20" fill="#5d4037"/>
  <line x1="495" y1="290" x2="485" y2="300" stroke="#5d4037" stroke-width="3"/>
  <line x1="505" y1="290" x2="515" y2="300" stroke="#5d4037" stroke-width="3"/>
  
  <!-- 自行车道 -->
  <rect x="100" y="400" width="600" height="20" fill="#43a047" opacity="0.5"/>
  <rect x="100" y="330" width="600" height="20" fill="#43a047" opacity="0.5"/>
  
  <!-- 自行车标志 -->
  <circle cx="350" cy="410" r="5" fill="white"/>
  <circle cx="360" cy="410" r="5" fill="white"/>
  <line x1="350" y1="410" x2="355" y2="400" stroke="white" stroke-width="2"/>
  
  <circle cx="450" cy="340" r="5" fill="white"/>
  <circle cx="460" cy="340" r="5" fill="white"/>
  <line x1="450" y1="340" x2="455" y2="330" stroke="white" stroke-width="2"/>
  
  <!-- 标签 -->
  <rect x="550" y="50" width="200" height="30" rx="5" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="570" y="70" font-family="Arial" font-size="14" fill="#2e7d32">库尔街道改造示例</text>
</svg>