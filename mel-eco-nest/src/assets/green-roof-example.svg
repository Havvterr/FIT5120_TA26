<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f5f5f5"/>
  
  <!-- 天空 -->
  <rect width="800" height="300" fill="#bbdefb"/>
  
  <!-- 建筑物基础 -->
  <rect x="100" y="200" width="600" height="400" fill="#90a4ae"/>
  
  <!-- 建筑物窗户 -->
  <rect x="150" y="250" width="50" height="70" fill="#eceff1"/>
  <rect x="250" y="250" width="50" height="70" fill="#eceff1"/>
  <rect x="350" y="250" width="50" height="70" fill="#eceff1"/>
  <rect x="450" y="250" width="50" height="70" fill="#eceff1"/>
  <rect x="550" y="250" width="50" height="70" fill="#eceff1"/>
  
  <rect x="150" y="350" width="50" height="70" fill="#eceff1"/>
  <rect x="250" y="350" width="50" height="70" fill="#eceff1"/>
  <rect x="350" y="350" width="50" height="70" fill="#eceff1"/>
  <rect x="450" y="350" width="50" height="70" fill="#eceff1"/>
  <rect x="550" y="350" width="50" height="70" fill="#eceff1"/>
  
  <rect x="150" y="450" width="50" height="70" fill="#eceff1"/>
  <rect x="250" y="450" width="50" height="70" fill="#eceff1"/>
  <rect x="350" y="450" width="50" height="70" fill="#eceff1"/>
  <rect x="450" y="450" width="50" height="70" fill="#eceff1"/>
  <rect x="550" y="450" width="50" height="70" fill="#eceff1"/>
  
  <!-- 绿色屋顶 -->
  <rect x="100" y="200" width="600" height="20" fill="#5d4037"/>
  
  <!-- 植被层 -->
  <rect x="100" y="180" width="600" height="20" fill="#81c784"/>
  
  <!-- 屋顶植物 -->
  <!-- 草地 -->
  <rect x="100" y="150" width="600" height="30" fill="#66bb6a"/>
  
  <!-- 灌木 -->
  <circle cx="150" cy="140" r="15" fill="#2e7d32"/>
  <circle cx="200" cy="145" r="12" fill="#388e3c"/>
  <circle cx="250" cy="140" r="15" fill="#2e7d32"/>
  <circle cx="300" cy="145" r="12" fill="#388e3c"/>
  <circle cx="350" cy="140" r="15" fill="#2e7d32"/>
  <circle cx="400" cy="145" r="12" fill="#388e3c"/>
  <circle cx="450" cy="140" r="15" fill="#2e7d32"/>
  <circle cx="500" cy="145" r="12" fill="#388e3c"/>
  <circle cx="550" cy="140" r="15" fill="#2e7d32"/>
  <circle cx="600" cy="145" r="12" fill="#388e3c"/>
  <circle cx="650" cy="140" r="15" fill="#2e7d32"/>
  
  <!-- 花朵 -->
  <circle cx="180" cy="135" r="5" fill="#f06292"/>
  <circle cx="280" cy="130" r="5" fill="#ba68c8"/>
  <circle cx="380" cy="135" r="5" fill="#ffeb3b"/>
  <circle cx="480" cy="130" r="5" fill="#f06292"/>
  <circle cx="580" cy="135" r="5" fill="#ba68c8"/>
  <circle cx="680" cy="130" r="5" fill="#ffeb3b"/>
  
  <!-- 太阳能板 -->
  <rect x="120" y="160" width="40" height="20" fill="#263238"/>
  <rect x="320" y="160" width="40" height="20" fill="#263238"/>
  <rect x="520" y="160" width="40" height="20" fill="#263238"/>
  
  <!-- 屋顶花园小径 -->
  <rect x="220" y="150" width="20" height="30" fill="#bcaaa4"/>
  <rect x="420" y="150" width="20" height="30" fill="#bcaaa4"/>
  <rect x="620" y="150" width="20" height="30" fill="#bcaaa4"/>
  
  <!-- 屋顶边缘 -->
  <rect x="100" y="200" width="600" height="5" fill="#455a64"/>
  
  <!-- 太阳 -->
  <circle cx="700" cy="100" r="40" fill="#ffeb3b"/>
  
  <!-- 太阳光线 -->
  <line x1="700" y1="40" x2="700" y2="20" stroke="#ffeb3b" stroke-width="3"/>
  <line x1="760" y1="100" x2="780" y2="100" stroke="#ffeb3b" stroke-width="3"/>
  <line x1="700" y1="160" x2="700" y2="180" stroke="#ffeb3b" stroke-width="3"/>
  <line x1="640" y1="100" x2="620" y2="100" stroke="#ffeb3b" stroke-width="3"/>
  
  <line x1="740" y1="60" x2="755" y2="45" stroke="#ffeb3b" stroke-width="3"/>
  <line x1="740" y1="140" x2="755" y2="155" stroke="#ffeb3b" stroke-width="3"/>
  <line x1="660" y1="140" x2="645" y2="155" stroke="#ffeb3b" stroke-width="3"/>
  <line x1="660" y1="60" x2="645" y2="45" stroke="#ffeb3b" stroke-width="3"/>
  
  <!-- 降温效果指示 -->
  <defs>
    <linearGradient id="coolGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="100" y="150" width="600" height="100" fill="url(#coolGradient)"/>
  
  <!-- 标签 -->
  <rect x="550" y="50" width="200" height="30" rx="5" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="570" y="70" font-family="Arial" font-size="14" fill="#2e7d32">绿色屋顶降温示例</text>
</svg>